name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
env: {CARGO_TERM_COLOR: always}
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'clippy, rustfmt'}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (real processes, real orphans)
        run: cargo test -- --nocapture
  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "v=$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '${{ steps.msrv.outputs.v }}'}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
  demo:
    name: demo end to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: make a mess, find it, stop exactly it
        shell: bash
        env: {COLUMNS: '110', NO_COLOR: '1'}
        run: |
          set -euo pipefail
          R=target/release/runon
          $R demo
          set +e; $R; c=$?; set -e
          test "$c" = 3
          $R stop --dry-run
          $R stop --yes
          $R --all || test $? = 3
          $R stop --demo
          set +e; $R; c=$?; set -e
          echo "exit after cleanup: $c"
